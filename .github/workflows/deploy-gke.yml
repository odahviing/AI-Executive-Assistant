name: Deploy to GKE

# Auto-build + deploy. On every push to master that touches app code or infra,
# build an immutable image (tagged with the commit SHA), push to Artifact
# Registry, and roll it out to GKE. Auth is keyless via Workload Identity
# Federation — no long-lived GCP service-account key stored in GitHub.
#
# ⚠️  Fill in the `env:` placeholders below and set up WIF before enabling. All
#     TODO values come from your GCP project / GKE cluster.

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "Dockerfile"
      - "k8s/**"
      - ".github/workflows/deploy-gke.yml"
  workflow_dispatch: {}

# Never let two deploys overlap — a mid-deploy overlap plus the Recreate strategy
# keeps the single-socket invariant safe.
concurrency:
  group: deploy-gke
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: TODO-project-id                        # TODO
  GCP_REGION: us-central1                                # TODO (Artifact Registry region)
  AR_REPO: maelle                                        # TODO (Artifact Registry repo)
  GKE_CLUSTER: TODO-cluster-name                         # TODO
  GKE_LOCATION: us-central1                              # TODO (cluster region/zone)
  K8S_NAMESPACE: maelle
  # Workload Identity Federation (create once — see k8s/README.md):
  WIF_PROVIDER: projects/TODO-NUMBER/locations/global/workloadIdentityPools/github/providers/github  # TODO
  DEPLOY_SA: maelle-deployer@TODO-project-id.iam.gserviceaccount.com                                   # TODO

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required for Workload Identity Federation (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (keyless / WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Compute image ref + version
        id: meta
        run: |
          echo "image=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}/maelle" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            --build-arg GIT_SHA=${{ steps.meta.outputs.short_sha }} \
            --build-arg APP_VERSION=${{ steps.meta.outputs.version }} \
            -t ${{ steps.meta.outputs.image }}:${{ github.sha }} \
            -t ${{ steps.meta.outputs.image }}:latest \
            .

      - name: Push image
        run: |
          docker push ${{ steps.meta.outputs.image }}:${{ github.sha }}
          docker push ${{ steps.meta.outputs.image }}:latest

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_LOCATION }}

      - name: Deploy (kustomize → kubectl apply)
        run: |
          cd k8s
          # Pin the freshly built, immutable tag before applying.
          sed -i "s|newTag:.*|newTag: ${{ github.sha }}|" kustomization.yaml
          sed -i "s|newName:.*|newName: ${{ steps.meta.outputs.image }}|" kustomization.yaml
          kubectl apply -k .
          kubectl -n ${{ env.K8S_NAMESPACE }} rollout status deployment/maelle --timeout=180s
