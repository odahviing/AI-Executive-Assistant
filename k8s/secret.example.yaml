# ─────────────────────────────────────────────────────────────────────────────
# TEMPLATE ONLY — do NOT put real values here or commit a filled copy.
# Documents the `maelle-secrets` Secret the Deployment reads (secretKeyRef).
# Create the REAL Secret out-of-band, ideally sourced from GCP Secret Manager
# (Secret Manager CSI driver / External Secrets Operator) so values never touch git.
#
# Quick manual creation (dev / bootstrap):
#
#   kubectl create secret generic maelle-secrets \
#     --from-literal=SLACK_BOT_TOKEN=xoxb-... \
#     --from-literal=SLACK_APP_TOKEN=xapp-... \
#     --from-literal=SLACK_SIGNING_SECRET=... \
#     --from-literal=AZURE_TENANT_ID=... \
#     --from-literal=AZURE_CLIENT_ID=... \
#     --from-literal=AZURE_CLIENT_SECRET=...
#     # optional, only if used:
#     # --from-literal=OPENAI_API_KEY=...
#     # --from-literal=TAVILY_API_KEY=...
#     # --from-literal=BRAVE_SEARCH_API_KEY=...
#
# NOTE — the platform-team template listed only the 3 SLACK_* keys. Maelle also
# REQUIRES the AZURE_* keys or it exits at startup (calendar access). There is NO
# ANTHROPIC_API_KEY — Claude runs on Vertex AI, authenticated by the pod's
# Workload Identity service account.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: maelle-secrets
type: Opaque
stringData:
  SLACK_BOT_TOKEN: REPLACE_ME          # xoxb-...
  SLACK_APP_TOKEN: REPLACE_ME          # xapp-...
  SLACK_SIGNING_SECRET: REPLACE_ME
  AZURE_TENANT_ID: REPLACE_ME
  AZURE_CLIENT_ID: REPLACE_ME
  AZURE_CLIENT_SECRET: REPLACE_ME
  OPENAI_API_KEY: REPLACE_ME           # voice — Whisper transcription + TTS
  TAVILY_API_KEY: REPLACE_ME           # web search — news + web_search tool
  # BRAVE_SEARCH_API_KEY: REPLACE_ME   # unused — Tavily is the search backend
