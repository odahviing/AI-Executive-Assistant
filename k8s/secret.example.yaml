# ─────────────────────────────────────────────────────────────────────────────
# TEMPLATE ONLY — do NOT put real values here and do NOT commit a filled copy.
# This file documents the shape of the `maelle-env` Secret the Deployment expects
# (envFrom). Create the REAL Secret out-of-band, ideally sourced from GCP Secret
# Manager (via the Secret Manager CSI driver or External Secrets Operator) so the
# values never pass through git.
#
# Quick manual creation (dev / bootstrap):
#
#   kubectl -n maelle create secret generic maelle-env \
#     --from-literal=AZURE_TENANT_ID=... \
#     --from-literal=AZURE_CLIENT_ID=... \
#     --from-literal=AZURE_CLIENT_SECRET=... \
#     --from-literal=OPENAI_API_KEY=...        # optional (voice transcription/TTS)
#     --from-literal=TAVILY_API_KEY=...        # optional (web search)
#     --from-literal=BRAVE_SEARCH_API_KEY=...  # optional (web search)
#
# Deliberately NOT here:
#   • ANTHROPIC_API_KEY — the LLM runs on Vertex AI, authenticated by the pod's
#     Workload Identity service account. There is no key to store.
#   • Slack bot/app tokens + signing secret — these live in config/users/idan.yaml
#     (on the PVC), because the profile schema requires them inline and there is no
#     env override today. Hardening TODO: add env overrides so the Slack tokens can
#     move into Secret Manager too, and idan.yaml on the PVC becomes secret-free.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: maelle-env
type: Opaque
stringData:
  AZURE_TENANT_ID: REPLACE_ME
  AZURE_CLIENT_ID: REPLACE_ME
  AZURE_CLIENT_SECRET: REPLACE_ME
  # OPENAI_API_KEY: REPLACE_ME
  # TAVILY_API_KEY: REPLACE_ME
  # BRAVE_SEARCH_API_KEY: REPLACE_ME
