apiVersion: v1
kind: ServiceAccount
metadata:
  name: maelle
  annotations:
    # ── Workload Identity ─────────────────────────────────────────────────────
    # Binds this Kubernetes SA to a GCP service account so the pod gets keyless
    # Application Default Credentials (via the metadata server). This is what lets
    # the Vertex AI client authenticate with NO key file and NO Anthropic API key.
    #
    # One-time setup (fill in PROJECT_ID; requires Workload Identity enabled on the
    # cluster and the maelle namespace to exist):
    #
    #   gcloud iam service-accounts create maelle
    #
    #   # Vertex AI (the Claude calls):
    #   gcloud projects add-iam-policy-binding PROJECT_ID \
    #     --member  "serviceAccount:maelle@PROJECT_ID.iam.gserviceaccount.com" \
    #     --role    "roles/aiplatform.user"
    #
    #   # (Optional) let the pod read secrets straight from Secret Manager:
    #   gcloud projects add-iam-policy-binding PROJECT_ID \
    #     --member  "serviceAccount:maelle@PROJECT_ID.iam.gserviceaccount.com" \
    #     --role    "roles/secretmanager.secretAccessor"
    #
    #   # Let the KSA impersonate the GSA:
    #   gcloud iam service-accounts add-iam-policy-binding \
    #     maelle@PROJECT_ID.iam.gserviceaccount.com \
    #     --role    "roles/iam.workloadIdentityUser" \
    #     --member  "serviceAccount:PROJECT_ID.svc.id.goog[maelle/maelle]"
    #
    iam.gke.io/gcp-service-account: maelle@PROJECT_ID.iam.gserviceaccount.com   # TODO
