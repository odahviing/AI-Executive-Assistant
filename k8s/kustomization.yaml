apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All resources land in the `maelle` namespace. Create it once:
#   kubectl create namespace maelle
namespace: maelle

resources:
  - serviceaccount.yaml
  - pvc.yaml
  - deployment.yaml
  # secret.example.yaml is intentionally NOT listed — the real `maelle-env`
  # Secret is created out-of-band (Secret Manager) so secrets never flow through
  # kustomize/git. See secret.example.yaml + README.

images:
  # `deployment.yaml` uses the bare image name `maelle`; kustomize rewrites it to
  # the real Artifact Registry path. CI pins `newTag` to the commit SHA at deploy
  # time (see .github/workflows/deploy-gke.yml).
  - name: maelle
    newName: REGION-docker.pkg.dev/PROJECT_ID/REPO/maelle   # TODO
    newTag: latest
