# ===================================================================
#  Executive Assistant — User Profile Template
#  Copy to: config/users/<your-name>.yaml
#  config/users/ is gitignored — filled profiles stay private.
# ===================================================================
#
#  Each top-level section has a REQUIRED block (must be filled) and
#  an OPTIONAL block (all fields default — delete the lines you don't
#  need; Maelle still runs).
#
#  A profile with ONLY the REQUIRED lines (~20 lines total) boots fine.
# ===================================================================


# ─── USER ───────────────────────────────────────────────────────────
user:
  # === Required ===
  name:           "Your Full Name"             # Real first + last name
  email:          "you@yourcompany.com"        # Your company email
  timezone:       "Asia/Jerusalem"             # IANA TZ (America/New_York, Europe/London, ...)
  slack_user_id:  "UXXXXXXXXX"                 # Slack → Profile → "Copy member ID"
  # === Optional (defaults shown) ===
  # role:         "CEO"                        # Used in assistant context           (default: unset)
  # language:     "en"                         # Default reply language              (default: en)
  # units:        "metric"                     # metric | imperial                   (default: metric)
  # company:      "Your Company"               # Company name in identity prompts    (default: unset)
  # company_brief: |                            # Short company description           (default: unset)
  #   What your company does, who it serves, key product positioning.


# ─── ASSISTANT ──────────────────────────────────────────────────────
assistant:
  # === Required ===
  name: "Maelle"                               # Display name in Slack / invites
  slack:                                        # Create at https://api.slack.com/apps
    bot_token:      "xoxb-..."                  # Bot token
    app_token:      "xapp-..."                  # App-level token
    signing_secret: "..."                       # Signing secret
  # === Optional (defaults shown) ===
  # slack_display_name: "Maelle"                # Slack display name                 (default: same as name)
  # email:        "maelle@yourcompany.com"      # Used on calendar invites           (default: unset)
  # persona: |                                   # Voice + tone                        (default: warm professional EA)
  #   You are sharp, warm, and direct — a real person who runs things.
  #   Natural greetings, clear and efficient, never robotic.


# ─── SCHEDULE ───────────────────────────────────────────────────────
schedule:
  # === Required ===
  office_days:
    days: ["Monday", "Wednesday", "Thursday"]   # In-office weekdays
  home_days:
    days: ["Sunday", "Tuesday"]                 # Remote / home-office weekdays
  work_hours:                                    # Per-day hours; split-shift OK
    Sunday:    ["09:00-17:30"]
    Monday:    ["09:00-17:30"]
    Tuesday:   ["09:00-17:30"]
    Wednesday: ["10:30-18:30"]
    Thursday:  ["10:30-18:30"]
  # === Optional (defaults shown) ===
  # day_boundary_hour: "00:00"                  # Late-night cutoff (use "05:00" if you work past midnight)  (default: 00:00)
  # night_shift:                                # Late-night work block
  #   hours_start:    "22:00"
  #   hours_end:      "02:00"
  #   typical_day:    "Tuesday"
  #   blocking_event: "Home Time"


# ─── MEETINGS ───────────────────────────────────────────────────────
# All fields optional. Defaults shown for reference.
meetings:
  # allowed_durations: [25, 50]                 # Meeting lengths Maelle picks from  (default: [25, 50])
  # default_meeting_duration: 25                # Default when conversation doesn't name one  (default: smallest of allowed)
  # buffer_minutes: 0                            # Buffer between meetings; 0 = back-to-back ok  (default: 0)
  # free_time_per_office_day_hours: 2           # Protected focus time per office day  (default: 2)
  # free_time_per_home_day_hours:   1           # Same, for home days                 (default: same as office)
  # thinking_time_min_chunk_minutes: 30         # Smallest focus block worth counting (default: 30)
  # min_slot_buffer_hours: 4                    # How far ahead colleagues can book  (owner gets 1h)  (default: 4)
  # physical_meetings_require_office_day: false # Force in-person → office days only (default: false)
  # room_email: "meeting@yourcompany.com"       # Meeting-room mailbox for booking   (default: unset)

  # Floating blocks — flexible protected time (lunch, gym, focus, etc.)
  # Maelle reshuffles them inside the window to fit meetings — no approval needed.
  # floating_blocks:
  #   - name: "lunch"
  #     preferred_start: "11:30"
  #     preferred_end:   "13:30"
  #     duration_minutes: 25

  # Events whose subjects match this list are skipped by issue detection.
  # issue_exclusions:
  #   subjects: ["Home Time", "Family Block"]


# ─── OUTLOOK CATEGORIES ─────────────────────────────────────────────
# Define ONLY if you use Outlook categories. Order = priority (first match wins).
# Default: no categories.
# categories:
#   - name: "Interview"
#     description: "Hiring candidate interviews — internal + external candidate."
#     limits: { per_day: 2 }
#     sets_sensitivity_private: true            # Mark as private in Outlook
#   - name: "Personal"
#     description: "Personal / family events — not work."
#     sets_sensitivity_private: true
#     no_issue_tracking: true                   # Skip from calendar-issue detection


# ─── BEHAVIOR ───────────────────────────────────────────────────────
# All optional. Defaults shown.
# behavior:
#   calendar_health_mode: "passive"             # passive | active — auto-fix calendar issues  (default: passive)
#   intent_aware_tools: false                   # Pre-pass to filter tools per turn (saves ~11k tokens)  (default: false)
#   deterministic_approval_resolve: false       # Auto-resolve obvious yes/no on approvals  (default: false)
#   v1_shadow_mode: false                       # Mirror every autonomous action to owner DM  (default: false)


# ─── SKILLS ─────────────────────────────────────────────────────────
# Feature toggles. Defaults shown.
# skills:
#   meetings:  true                              # Calendar + scheduling tools         (default: true)
#   calendar:  true                              # Calendar health checks              (default: true)
#   search:    true                              # Web search / extract                (default: true)
#   summary:   false                             # Meeting transcript summarization    (default: false)
#   knowledge: false                             # KB skill (config/users/<name>_kb/) (default: false)
#   social:    false                             # Proactive social engagement         (default: false)
#   venue:     false                             # External venue discovery            (default: false)


